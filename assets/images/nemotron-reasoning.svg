<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nemotron structured reasoning illustration</title>
  <desc id="desc">A diagram of task classification, rule discovery, verification, compact reasoning traces, QLoRA training, and boxed answers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf2ef"/><stop offset="1" stop-color="#dce7e1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#28473b" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <g opacity=".22" fill="none" stroke="#567365"><circle cx="1030" cy="110" r="170"/><circle cx="1030" cy="110" r="210"/><circle cx="160" cy="560" r="170"/></g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 210)">
      <rect width="190" height="210" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="95" y="52" font-size="21" font-weight="700" text-anchor="middle" fill="#20312a">Task family</text>
      <g transform="translate(35 82)" font-size="12" font-weight="700" text-anchor="middle">
        <circle cx="24" cy="24" r="22" fill="#dcebe5" stroke="#24695a"/><text x="24" y="28" fill="#24695a">A</text>
        <circle cx="84" cy="24" r="22" fill="#dcebe5" stroke="#24695a"/><text x="84" y="28" fill="#24695a">B</text>
        <circle cx="144" cy="24" r="22" fill="#dcebe5" stroke="#24695a"/><text x="144" y="28" fill="#24695a">C</text>
        <circle cx="24" cy="84" r="22" fill="#e1e8ed" stroke="#49677d"/><text x="24" y="88" fill="#49677d">D</text>
        <circle cx="84" cy="84" r="22" fill="#e1e8ed" stroke="#49677d"/><text x="84" y="88" fill="#49677d">E</text>
        <circle cx="144" cy="84" r="22" fill="#e1e8ed" stroke="#49677d"/><text x="144" y="88" fill="#49677d">F</text>
      </g>
      <text x="95" y="188" font-size="12" text-anchor="middle" fill="#66776f">classify before solving</text>
    </g>
    <g transform="translate(315 135)">
      <rect width="225" height="360" rx="32" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="112.5" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#20312a">Reasoning trace</text>
      <g transform="translate(30 82)">
        <rect width="165" height="42" rx="10" fill="#dcebe5" stroke="#85a697"/>
        <text x="82.5" y="26" font-size="12" text-anchor="middle" fill="#285e50">1 · key diagnostic</text>
        <rect y="58" width="165" height="42" rx="10" fill="#e7ece9" stroke="#a1b1aa"/>
        <text x="82.5" y="84" font-size="12" text-anchor="middle" fill="#56665f">2 · rule hypothesis</text>
        <rect y="116" width="165" height="42" rx="10" fill="#e7ece9" stroke="#a1b1aa"/>
        <text x="82.5" y="142" font-size="12" text-anchor="middle" fill="#56665f">3 · verify examples</text>
        <rect y="174" width="165" height="42" rx="10" fill="#e1e8ed" stroke="#8aa0af"/>
        <text x="82.5" y="200" font-size="12" text-anchor="middle" fill="#49677d">4 · apply to query</text>
        <rect y="232" width="165" height="42" rx="10" fill="#24695a" stroke="#174f42"/>
        <text x="82.5" y="258" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">\boxed{answer}</text>
      </g>
      <text x="112.5" y="334" font-size="12" text-anchor="middle" fill="#66776f">compact · consistent · checked</text>
    </g>
    <g transform="translate(600 190)">
      <rect width="235" height="250" rx="32" fill="#1d5b4c" stroke="#15483d"/>
      <text x="117.5" y="54" font-size="24" font-weight="700" text-anchor="middle" fill="#fff">4-bit QLoRA</text>
      <g transform="translate(36 86)" fill="none" stroke="#9ad1bf" stroke-width="3">
        <rect width="163" height="92" rx="18"/>
        <path d="M20 28h123M20 48h82M20 68h104" stroke-linecap="round"/>
      </g>
      <text x="117.5" y="204" font-size="13" text-anchor="middle" fill="#cfe5dc">PEFT adapter · rank ≤ 32</text>
      <text x="117.5" y="226" font-size="12" text-anchor="middle" fill="#9fc8b9">memory-efficient fine-tuning</text>
    </g>
    <g transform="translate(900 210)">
      <rect width="230" height="210" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="115" y="50" font-size="22" font-weight="700" text-anchor="middle" fill="#20312a">Deterministic eval</text>
      <g transform="translate(44 80)">
        <rect width="142" height="70" rx="16" fill="#e1e8ed" stroke="#7891a2"/>
        <text x="71" y="31" font-size="12" text-anchor="middle" fill="#49677d">temperature 0</text>
        <text x="71" y="51" font-size="12" text-anchor="middle" fill="#49677d">vLLM + exact metric</text>
      </g>
      <text x="115" y="180" font-size="13" font-weight="700" text-anchor="middle" fill="#24695a">0.53 → 0.668</text>
    </g>
  </g>
  <g fill="none" stroke="#6c887c" stroke-width="5" stroke-linecap="round"><path d="M260 315h30"/><path d="M540 315h35"/><path d="M835 315h40"/></g>
  <g fill="#6c887c"><path d="M290 315l-14-9v18z"/><path d="M575 315l-14-9v18z"/><path d="M875 315l-14-9v18z"/></g>
</svg>
