<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise RAG architecture illustration</title>
  <desc id="desc">A calm abstract diagram showing a query moving through expansion, retrieval, reranking, evidence, and answer stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e9f1ed"/>
      <stop offset="1" stop-color="#dce7e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#375c4e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="44" fill="url(#bg)"/>
  <g opacity=".28" stroke="#547466">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(72 230)">
      <rect width="170" height="170" rx="34" fill="#fbfcfa" stroke="#9aafa4"/>
      <circle cx="85" cy="63" r="26" fill="#d7e7df" stroke="#2d6d5d"/>
      <path d="M70 63h30M85 48v30" stroke="#2d6d5d" stroke-width="5" stroke-linecap="round"/>
      <text x="85" y="125" fill="#20312a" font-size="22" text-anchor="middle" font-weight="700">Query</text>
      <text x="85" y="148" fill="#66776f" font-size="13" text-anchor="middle">intent + context</text>
    </g>
    <g transform="translate(285 155)">
      <rect width="185" height="145" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="92.5" y="62" fill="#20312a" font-size="21" text-anchor="middle" font-weight="700">Expansion</text>
      <text x="92.5" y="90" fill="#66776f" font-size="13" text-anchor="middle">multiple search views</text>
      <g fill="#dcebe5" stroke="#2d6d5d">
        <rect x="36" y="108" width="29" height="12" rx="6"/>
        <rect x="78" y="108" width="29" height="12" rx="6"/>
        <rect x="120" y="108" width="29" height="12" rx="6"/>
      </g>
    </g>
    <g transform="translate(285 335)">
      <rect width="185" height="145" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="92.5" y="62" fill="#20312a" font-size="21" text-anchor="middle" font-weight="700">Retrieval</text>
      <text x="92.5" y="90" fill="#66776f" font-size="13" text-anchor="middle">dense + hybrid search</text>
      <g fill="#49677d">
        <circle cx="55" cy="114" r="7"/><circle cx="92" cy="114" r="7"/><circle cx="129" cy="114" r="7"/>
      </g>
    </g>
    <g transform="translate(530 230)">
      <rect width="190" height="170" rx="34" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="95" y="58" fill="#20312a" font-size="21" text-anchor="middle" font-weight="700">Reranking</text>
      <text x="95" y="84" fill="#66776f" font-size="13" text-anchor="middle">relevance + evidence</text>
      <g fill="#dcebe5" stroke="#2d6d5d">
        <rect x="48" y="104" width="94" height="13" rx="6.5"/>
        <rect x="48" y="128" width="72" height="13" rx="6.5"/>
        <rect x="48" y="152" width="51" height="13" rx="6.5"/>
      </g>
    </g>
    <g transform="translate(780 155)">
      <rect width="175" height="145" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="87.5" y="62" fill="#20312a" font-size="21" text-anchor="middle" font-weight="700">Evidence</text>
      <text x="87.5" y="90" fill="#66776f" font-size="13" text-anchor="middle">grounded context</text>
      <path d="M48 112h80M48 126h55" stroke="#2d6d5d" stroke-width="8" stroke-linecap="round" opacity=".6"/>
    </g>
    <g transform="translate(780 335)">
      <rect width="175" height="145" rx="30" fill="#fbfcfa" stroke="#9aafa4"/>
      <text x="87.5" y="62" fill="#20312a" font-size="21" text-anchor="middle" font-weight="700">Evaluation</text>
      <text x="87.5" y="90" fill="#66776f" font-size="13" text-anchor="middle">MRR · NDCG · hit rate</text>
      <path d="M48 126l24-22 22 12 34-35" fill="none" stroke="#49677d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(995 230)">
      <rect width="150" height="170" rx="34" fill="#1e5d4e" stroke="#154c40"/>
      <circle cx="75" cy="59" r="23" fill="#9ad1bf" opacity=".95"/>
      <path d="M64 59l8 8 16-18" fill="none" stroke="#174f42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="120" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">Answer</text>
      <text x="75" y="144" fill="#cfe5dc" font-size="13" text-anchor="middle">cited + reliable</text>
    </g>
  </g>
  <g fill="none" stroke="#6b8a7d" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M242 315H267"/><path d="M470 227h35q25 0 25 25"/><path d="M470 408h35q25 0 25-25"/>
    <path d="M720 315h35q25 0 25-25"/><path d="M720 315h35q25 0 25 25"/><path d="M955 227h18q22 0 22 28"/><path d="M955 408h18q22 0 22-28"/>
  </g>
</svg>
